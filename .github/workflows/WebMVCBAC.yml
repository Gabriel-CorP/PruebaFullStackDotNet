name: Compilar e implementar la aplicación de .NET Core en la aplicación web WebMVCBAC

on:
  push:
    branches:
    - main
  workflow_dispatch:   # permite ejecutarlo a mano desde la pestaña Actions

permissions:
  id-token: write
  contents: read

env:
  AZURE_WEBAPP_NAME: WebMVCBAC
  AZURE_WEBAPP_PACKAGE_PATH: published   # carpeta de publicación en la raíz del repositorio
  CONFIGURATION: Release
  DOTNET_CORE_VERSION: 8.0.x

jobs:
  build:
    environment: WebMVCBAC_Env
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4

    # Busca Ventas.Web.csproj en el repositorio: así no depende de en qué carpeta esté el MVC.
    - name: Localizar el proyecto del MVC
      shell: pwsh
      run: |
        $csproj = git ls-files '*Ventas.Web.csproj' | Select-Object -First 1
        if (-not $csproj) {
          Write-Host "Proyectos .csproj encontrados en el repositorio:"
          git ls-files '*.csproj'
          throw "No se encontró Ventas.Web.csproj en el repositorio."
        }
        Write-Host "Proyecto MVC: $csproj"
        "PROJECT_PATH=$csproj" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_CORE_VERSION }}

    - name: Restore
      run: dotnet restore "${{ env.PROJECT_PATH }}"

    - name: Build
      run: dotnet build "${{ env.PROJECT_PATH }}" --configuration ${{ env.CONFIGURATION }} --no-restore

    - name: Publish
      run: dotnet publish "${{ env.PROJECT_PATH }}" --configuration ${{ env.CONFIGURATION }} --no-build --output "${{ env.AZURE_WEBAPP_PACKAGE_PATH }}"

    - name: Publish Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: webapp
        path: ${{ env.AZURE_WEBAPP_PACKAGE_PATH }}

  deploy:
    environment: WebMVCBAC_Env
    runs-on: windows-latest
    needs: build
    steps:
    - name: Download artifact from build job
      uses: actions/download-artifact@v4
      with:
        name: webapp
        path: ${{ env.AZURE_WEBAPP_PACKAGE_PATH }}

    - name: Azure Login
      uses: azure/login@v2
      with:
        client-id: ${{ vars.WebMVCBAC_CLIENT_ID_0F21 }}
        tenant-id: ${{ vars.WebMVCBAC_TENANT_ID_E53D }}
        subscription-id: ${{ vars.WebMVCBAC_SUBSCRIPTION_ID_E53D }}

    - name: Deploy to Azure WebApp
      uses: azure/webapps-deploy@v2
      with:
        app-name: ${{ env.AZURE_WEBAPP_NAME }}
        package: ${{ env.AZURE_WEBAPP_PACKAGE_PATH }}